<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Cadeaux de la famille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<script>/* Dates des fêtes (France) et thème avant l'affichage. */
(function(){
  function paques(y){var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),n=h+l-7*m+114;return new Date(y,Math.floor(n/31)-1,n%31+1)}
  /* Fête des mères : dernier dimanche de mai, ou premier dimanche de juin si c'est la Pentecôte. */
  function meres(y){var d=new Date(y,4,31);d.setDate(31-d.getDay());var pe=paques(y);pe.setDate(pe.getDate()+49);if(pe.getTime()===d.getTime())d.setDate(d.getDate()+7);return d}
  /* Fête des pères : troisième dimanche de juin. */
  function peres(y){var d=new Date(y,5,1);d.setDate(1+(7-d.getDay())%7+14);return d}
  var t=new Date();t=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  function prochaine(fn){var d=fn(t.getFullYear());return d<t?fn(t.getFullYear()+1):d}
  window.FETES={meres:function(){return prochaine(meres)},peres:function(){return prochaine(peres)}};
  var y=t.getFullYear(),m=meres(y),pe=peres(y),auto;
  if(t.getMonth()>=10)auto="noel";
  else if(t>=new Date(y,m.getMonth(),m.getDate()-21)&&t<=m)auto="meres";
  else if(t>m&&t<=pe)auto="peres";
  else auto="anniv";
  /* Un choix fait à la main est retenu 3 semaines, puis le thème suit à nouveau le calendrier. */
  var o="";try{var v=(localStorage.getItem("occ")||"").split("|");if(+v[1]>Date.now()-21*864e5)o=v[0]}catch(e){}
  if(!/^(noel|anniv|meres|peres)$/.test(o))o=auto;
  document.documentElement.setAttribute("data-occasion",o);
})();</script>
<style>
html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Thèmes : Noël (sapin, rouge, or), Anniversaires (violet, corail, soleil), Fête des mères (framboise, sauge, pêche), Fête des pères (bleu marine, moutarde, canard) ; clair et sombre */
:root,:root[data-occasion="noel"]{
  --bg:#F6F1E8; --surface:#FFFFFF; --fg:#1F1A17; --muted:#665D55; --line:#E5DBCD;
  --accent:#1E5B43; --accent-ink:#FFFFFF; --accent-soft:#DCECE3;
  --ribbon:#B3263A; --ribbon-soft:#F8DFE3; --gold:#A97A22; --gold-soft:#F5EAD2; --link:#1E5B43;
  --paper:#FBF7F0;
}
:root[data-occasion="anniv"]{
  --bg:#FBF4F1; --surface:#FFFFFF; --fg:#22182A; --muted:#6B5E73; --line:#EBDDE3;
  --accent:#6337B0; --accent-ink:#FFFFFF; --accent-soft:#EDE4F9;
  --ribbon:#C23C2A; --ribbon-soft:#FCE4DE; --gold:#B57C0E; --gold-soft:#FBEFCF; --link:#6337B0;
  --paper:#FDF8F6;
}
:root[data-occasion="meres"]{
  --bg:#FCF2F3; --surface:#FFFFFF; --fg:#2A1A1F; --muted:#6F5A61; --line:#F0DCDF;
  --accent:#A8295A; --accent-ink:#FFFFFF; --accent-soft:#FBE1EA;
  --ribbon:#4F7B5B; --ribbon-soft:#E2EEE4; --gold:#B8682A; --gold-soft:#FBEADB; --link:#A8295A;
  --paper:#FEF8F8;
}
:root[data-occasion="peres"]{
  --bg:#F0F3F7; --surface:#FFFFFF; --fg:#141C28; --muted:#556274; --line:#D8E0EA;
  --accent:#1F4E8C; --accent-ink:#FFFFFF; --accent-soft:#DFE8F5;
  --ribbon:#94650A; --ribbon-soft:#F6EBD0; --gold:#2B7A78; --gold-soft:#DCEFEE; --link:#1F4E8C;
  --paper:#F8FAFC;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]),:root:not([data-theme="light"])[data-occasion="noel"]{
    --bg:#121110; --surface:#1D1A17; --fg:#F2ECE4; --muted:#A99E92; --line:#352E28;
    --accent:#6CC59D; --accent-ink:#0C1A13; --accent-soft:#1C3A2C;
    --ribbon:#F07A8A; --ribbon-soft:#3E1F25; --gold:#E3B865; --gold-soft:#382C16; --link:#8AD5B2;
    --paper:#191714; color-scheme:dark}
  :root:not([data-theme="light"])[data-occasion="anniv"]{
    --bg:#13101A; --surface:#1E1826; --fg:#F1EAF5; --muted:#A698B0; --line:#352B3F;
    --accent:#B99CF2; --accent-ink:#1A0F2E; --accent-soft:#2E2343;
    --ribbon:#FF8C78; --ribbon-soft:#41231E; --gold:#F2C14E; --gold-soft:#3A2F14; --link:#C9B1F7;
    --paper:#1A1521; color-scheme:dark}
  :root:not([data-theme="light"])[data-occasion="meres"]{
    --bg:#170F12; --surface:#22171B; --fg:#F6EAEE; --muted:#B39EA6; --line:#3B2830;
    --accent:#F08AAE; --accent-ink:#2A0D18; --accent-soft:#43202D;
    --ribbon:#8CC79A; --ribbon-soft:#1F3526; --gold:#F0B27A; --gold-soft:#3B2817; --link:#F5A3C0;
    --paper:#1D1418; color-scheme:dark}
  :root:not([data-theme="light"])[data-occasion="peres"]{
    --bg:#0E131B; --surface:#172030; --fg:#E8EEF6; --muted:#9AA8BA; --line:#2A3648;
    --accent:#8DB4EE; --accent-ink:#0C1A2E; --accent-soft:#1F3150;
    --ribbon:#E5B44B; --ribbon-soft:#3A2E14; --gold:#6CC9C4; --gold-soft:#173533; --link:#A9C7F3;
    --paper:#131A26; color-scheme:dark}
}
:root[data-theme="dark"],:root[data-theme="dark"][data-occasion="noel"]{
  --bg:#121110; --surface:#1D1A17; --fg:#F2ECE4; --muted:#A99E92; --line:#352E28;
  --accent:#6CC59D; --accent-ink:#0C1A13; --accent-soft:#1C3A2C;
  --ribbon:#F07A8A; --ribbon-soft:#3E1F25; --gold:#E3B865; --gold-soft:#382C16; --link:#8AD5B2;
  --paper:#191714; color-scheme:dark}
:root[data-theme="dark"][data-occasion="anniv"]{
  --bg:#13101A; --surface:#1E1826; --fg:#F1EAF5; --muted:#A698B0; --line:#352B3F;
  --accent:#B99CF2; --accent-ink:#1A0F2E; --accent-soft:#2E2343;
  --ribbon:#FF8C78; --ribbon-soft:#41231E; --gold:#F2C14E; --gold-soft:#3A2F14; --link:#C9B1F7;
  --paper:#1A1521; color-scheme:dark}
:root[data-theme="dark"][data-occasion="meres"]{
  --bg:#170F12; --surface:#22171B; --fg:#F6EAEE; --muted:#B39EA6; --line:#3B2830;
  --accent:#F08AAE; --accent-ink:#2A0D18; --accent-soft:#43202D;
  --ribbon:#8CC79A; --ribbon-soft:#1F3526; --gold:#F0B27A; --gold-soft:#3B2817; --link:#F5A3C0;
  --paper:#1D1418; color-scheme:dark}
:root[data-theme="dark"][data-occasion="peres"]{
  --bg:#0E131B; --surface:#172030; --fg:#E8EEF6; --muted:#9AA8BA; --line:#2A3648;
  --accent:#8DB4EE; --accent-ink:#0C1A2E; --accent-soft:#1F3150;
  --ribbon:#E5B44B; --ribbon-soft:#3A2E14; --gold:#6CC9C4; --gold-soft:#173533; --link:#A9C7F3;
  --paper:#131A26; color-scheme:dark}
:root{--display:"Fraunces", Georgia, "Times New Roman", serif; --body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;transition:background-color .3s}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ico{display:inline-flex;width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
.ico svg{width:100%;height:100%}

/* Barre du haut : choix de l'occasion + compte */
.topbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding-block:16px 12px}
.occ{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.occ button{border:0;border-radius:99px;background:transparent;color:var(--muted);font-weight:700;padding:6px 14px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;flex:none}
.occ .s{display:none}
@media (max-width:600px){.occ button{padding:6px 10px}.occ .l{display:none}.occ .s{display:inline}}
.occ button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.acct{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.who-l{font-size:14px;color:var(--muted);font-weight:700}
.who-n{font-size:16px;margin-right:4px}

/* Bandeau : un paquet cadeau avec son ruban et son nœud */
.hero{position:relative;overflow:hidden;border-radius:18px;background-color:var(--surface);border:1px solid var(--line);padding:30px 128px 86px 28px;isolation:isolate}
:root[data-occasion="noel"] .hero{background-image:radial-gradient(color-mix(in srgb,var(--accent) 13%,transparent) 1.6px,transparent 2px);background-size:22px 22px}
:root[data-occasion="anniv"] .hero{background-image:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--gold) 12%,transparent) 0 10px,transparent 10px 26px)}
:root[data-occasion="meres"] .hero{background-image:radial-gradient(color-mix(in srgb,var(--accent) 14%,transparent) 2px,transparent 2.6px),radial-gradient(color-mix(in srgb,var(--ribbon) 16%,transparent) 2px,transparent 2.6px);background-size:26px 26px;background-position:0 0,13px 13px}
:root[data-occasion="peres"] .hero{background-image:repeating-linear-gradient(0deg,color-mix(in srgb,var(--accent) 7%,transparent) 0 7px,transparent 7px 30px),repeating-linear-gradient(90deg,color-mix(in srgb,var(--accent) 7%,transparent) 0 7px,transparent 7px 30px)}
.hero::before,.hero::after{content:"";position:absolute;z-index:-1;background:var(--ribbon);box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--fg) 8%,transparent)}
.hero::before{top:0;bottom:0;right:60px;width:24px}
.hero::after{left:0;right:0;bottom:40px;height:24px}
.bow{position:absolute;right:12px;bottom:12px;width:120px;height:80px;color:var(--ribbon);z-index:1;filter:drop-shadow(0 2px 2px color-mix(in srgb,var(--fg) 18%,transparent))}
.deco{position:absolute;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}
@media (max-width:860px){.deco{display:none}}
.deco>g[class^="deco-"]{display:none}
:root[data-occasion="noel"] .deco-noel,:root[data-occasion="anniv"] .deco-anniv,:root[data-occasion="meres"] .deco-meres,:root[data-occasion="peres"] .deco-peres{display:inline}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ribbon);font-weight:700;display:flex;align-items:center;gap:6px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(32px,6.4vw,54px);line-height:1.02;margin:8px 0 8px;text-wrap:balance;letter-spacing:-.01em}
h1 em{font-style:italic;color:var(--accent)}
.sub{color:var(--muted);margin:0;max-width:44ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:700;border-radius:99px;padding:6px 12px;background:var(--gold-soft);color:var(--fg);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent)}
.chip .ico{color:var(--gold)}
.chip.hot{background:var(--ribbon);color:#fff;border-color:var(--ribbon)}
.chip.hot .ico{color:#fff}
button.chip{cursor:pointer}
@media (max-width:600px){
  .hero{padding:24px 64px 76px 18px;border-radius:14px}
  .hero::before{right:26px;width:18px}.hero::after{bottom:34px;height:18px}
  .bow{right:-13px;bottom:11px;width:96px;height:64px}
  .deco{display:none}
  .who-l{display:none}
  .acct button.ghost{padding:5px 7px;font-size:15px}
}

/* Formulaires et boutons */
select,input,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
select:focus,input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 13px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.gift-btn{background:var(--ribbon);color:#fff;border-color:var(--ribbon);font-weight:700;display:inline-flex;align-items:center;gap:6px}
:root[data-theme="dark"] button.gift-btn{color:#1a0d0f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.gift-btn{color:#1a0d0f}}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 9px}
button.ghost:hover{color:var(--fg);background:color-mix(in srgb,var(--fg) 5%,transparent)}
button.danger{color:var(--danger,var(--ribbon))}
:root[data-occasion="meres"]{--danger:var(--accent)}
:root[data-occasion="peres"]{--danger:#B3261E}
:root[data-theme="dark"][data-occasion="peres"]{--danger:#F2877E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-occasion="peres"]{--danger:#F2877E}}
button:disabled{opacity:.5;cursor:not-allowed}

main{padding-block:24px 64px}
.banner{background:var(--ribbon-soft);color:var(--fg);border-radius:12px;padding:12px 14px;margin-bottom:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner strong{color:var(--ribbon)}

/* Cadeaux */
.gifts{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:760px){.gifts{grid-template-columns:minmax(0,1fr);gap:18px}}
.side-h{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:4px 0 10px}
.people{display:flex;flex-direction:column;gap:4px}
@media (max-width:760px){.people{flex-direction:row;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}.side-h{display:none}}
.person{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px;border-radius:12px;border:1px solid transparent;background:transparent;flex:none}
.person:hover{background:var(--surface)}
.person[aria-current="true"]{background:var(--surface);border-color:var(--line);box-shadow:0 1px 0 var(--line)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;flex:none;color:#fff;background:var(--c,var(--accent))}
.person[aria-current="true"] .av{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ribbon)}
.p-txt{display:flex;flex-direction:column;line-height:1.2;min-width:0;flex:1}
.p-name{font-weight:700;white-space:nowrap}
.p-bd{font-size:12.5px;color:var(--muted);white-space:nowrap}
.p-n{font-size:13px;font-weight:700;color:var(--muted);background:var(--bg);border-radius:99px;padding:1px 8px;font-variant-numeric:tabular-nums}
.person[aria-current="true"] .p-n{background:var(--ribbon-soft);color:var(--ribbon)}

.panel-h{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:6px 12px}
h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,4vw,34px);line-height:1.1;margin:0;text-wrap:balance}
.meta{color:var(--muted);font-size:14px}
.p-sub{color:var(--muted);font-size:14px;margin:4px 0 0;display:flex;align-items:center;gap:6px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 0}
.filters button{border-radius:99px;padding:5px 12px;font-size:14px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.filters .c{font-weight:400;opacity:.8;font-variant-numeric:tabular-nums}

form.add{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) 140px;gap:8px;margin:14px 0 20px;background:var(--paper);border:1.5px dashed var(--line);border-radius:14px;padding:14px}
form.add .lbl{grid-column:1/-1;font-weight:700;display:flex;align-items:center;gap:6px;color:var(--accent)}
form.add .n2{grid-column:1/3}
form.add .row{grid-column:1/-1;display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
@media (max-width:560px){form.add{grid-template-columns:minmax(0,1fr) 120px}form.add .t,form.add .n2{grid-column:1/-1}}

.list{display:flex;flex-direction:column;gap:12px}
.gift{position:relative;background:linear-gradient(var(--ribbon),var(--ribbon)) left top/6px 100% no-repeat,var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px 14px 22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px}
.gift.taken{background:linear-gradient(var(--accent),var(--accent)) left top/6px 100% no-repeat,var(--paper)}
.gift.taken .title{color:var(--muted)}
.gift .title{font-weight:700;font-size:17px;overflow-wrap:anywhere;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.gift .price{font-family:var(--display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--accent)}
.gift .note{color:var(--muted);font-size:15px;grid-column:1/-1;overflow-wrap:anywhere}
.gift .foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.gift .acts{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.gift a{color:var(--link);overflow-wrap:anywhere;font-weight:700}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--gold-soft);color:var(--fg);white-space:nowrap}
.tag .ico{color:var(--gold)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border-radius:99px;padding:3px 10px;background:var(--accent-soft);color:var(--accent)}
.by{font-size:13px;color:var(--muted)}
.sugg-h{display:flex;align-items:center;gap:8px;margin:18px 0 10px;font-family:var(--display);font-size:20px;font-weight:800}
.sugg-h .ico{color:var(--ribbon)}
.sugg-h .c{font-family:var(--body);font-size:13px;font-weight:700;background:var(--ribbon);color:#fff;border-radius:99px;padding:1px 9px}
.sugg-note{color:var(--muted);font-size:14px;margin:-4px 0 10px}
.gift.sugg{background:linear-gradient(var(--gold),var(--gold)) left top/6px 100% no-repeat,var(--gold-soft);border-style:dashed}
.gift.sent{background:linear-gradient(var(--line),var(--line)) left top/6px 100% no-repeat,var(--paper);border-style:dashed}
form.add.suggest{border-color:color-mix(in srgb,var(--gold) 45%,transparent);background:var(--gold-soft)}
form.add.suggest .lbl{color:var(--fg)}
form.add .hint{grid-column:1/-1;font-size:14px;color:var(--muted);margin:-4px 0 2px;display:flex;gap:6px;align-items:flex-start}
.p-new{font-size:12px;font-weight:700;background:var(--ribbon);color:#fff;border-radius:99px;padding:1px 7px}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:28px 22px;color:var(--muted);text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .ico{width:36px;height:36px;color:var(--ribbon)}
.secret{font-size:14px;color:var(--fg);background:var(--ribbon-soft);border-radius:12px;padding:10px 14px;display:flex;gap:8px;align-items:center;margin:0 0 14px}
.secret .ico{color:var(--ribbon)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);z-index:5}

/* Panneaux : compte, famille, anniversaires */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px;display:flex;flex-direction:column;gap:12px}
.panel h3{margin:0;font-family:var(--display);font-size:22px}
.panel p{margin:0}
.row-form{display:flex;flex-wrap:wrap;gap:8px}
.row-form input{flex:1 1 160px;min-width:0}
.fam-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.fam-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.fam-name{font-weight:700;display:flex;align-items:center;gap:10px}
.fam-name .av{width:28px;height:28px;font-size:13px}
.fam-act{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.code-note{background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.code-val{font-size:22px;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.ec-form{flex-basis:100%}
.ec-form input{font-variant-numeric:tabular-nums;letter-spacing:.08em}
.bd-val{color:var(--muted);font-size:14px;font-weight:400}
.bd-form select{flex:none}
.pill-off{display:inline-block;margin-left:2px;font-size:12px;font-weight:700;color:var(--muted);border:1px dashed var(--line);border-radius:99px;padding:1px 8px}

/* Connexion et première configuration */
.gate{padding-block:6px 60px}
.gate-card{max-width:480px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.gate-card::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:repeating-linear-gradient(90deg,var(--ribbon) 0 18px,var(--accent) 18px 36px,var(--gold) 36px 54px)}
.gate-card h2{margin:0}
.gate-card p{margin:0}
.gate-names{display:flex;flex-wrap:wrap;gap:8px}
.gate-names button{font-weight:700;border-radius:99px;padding:8px 16px}
.gate-names button:disabled{opacity:.45;cursor:not-allowed}
.gate-form{display:flex;flex-direction:column;gap:8px}
.gate-form label{font-size:14px;font-weight:700;color:var(--muted)}
.gate-card.wide{max-width:580px}
.su-head,.su-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 104px;gap:8px;align-items:center}
.su-head span{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.su-row input{width:100%}
.su-row input[id^="su-code"]{font-variant-numeric:tabular-nums;letter-spacing:.08em}
.su-tag{font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.su-row .ghost{justify-self:center}
@media (max-width:440px){.su-head,.su-row{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 40px}.su-tag{font-size:0}.su-tag::after{content:"★";font-size:16px}}
@media (prefers-reduced-motion:no-preference){.deco .tw{animation:tw 4s ease-in-out infinite alternate}.deco .tw:nth-child(3n){animation-delay:-1.5s}.deco .tw:nth-child(3n+1){animation-delay:-3s}}
@keyframes tw{from{opacity:.35}to{opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="occ" role="group" aria-label="Occasion">
      <button type="button" data-occ="noel" aria-pressed="false"><span class="ico" data-i="tree"></span>Noël</button>
      <button type="button" data-occ="anniv" aria-pressed="false"><span class="ico" data-i="cake"></span><span class="l">Anniversaires</span><span class="s">Anniv.</span></button>
      <button type="button" data-occ="meres" aria-pressed="false"><span class="ico" data-i="heart"></span><span class="l">Fête des mères</span><span class="s">Mères</span></button>
      <button type="button" data-occ="peres" aria-pressed="false"><span class="ico" data-i="tie"></span><span class="l">Fête des pères</span><span class="s">Pères</span></button>
    </div>
    <div class="acct" id="acct" aria-live="polite"></div>
  </div>

  <header class="hero">
    <svg class="deco" viewBox="0 0 1000 260" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
      <defs>
        <path id="heart" d="M0 8C-6 4-10 0-10-4a5 5 0 0 1 10-1 5 5 0 0 1 10 1c0 4-4 8-10 12z"/>
        <g id="flower"><circle cx="0" cy="-6" r="5"/><circle cx="5.7" cy="-1.9" r="5"/><circle cx="3.5" cy="4.9" r="5"/><circle cx="-3.5" cy="4.9" r="5"/><circle cx="-5.7" cy="-1.9" r="5"/><circle r="3.6" fill="var(--gold)"/></g>
        <path id="star" d="m0-10 2.9 6 6.6.9-4.8 4.6 1.2 6.5L0 4.9-5.9 8l1.1-6.5-4.7-4.6 6.6-.9z"/>
        <g id="flake" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M0-10V10M-8.7-5 8.7 5M-8.7 5 8.7-5M0-10l-3-3M0-10l3-3M0 10l-3 3M0 10l3 3"/></g>
      </defs>
      <g class="deco-noel" style="color:var(--accent)">
        <use class="tw" href="#flake" transform="translate(650 34) scale(.8)" opacity=".4"/>
        <use class="tw" href="#flake" transform="translate(830 46) scale(1.4)" opacity=".55"/>
        <use class="tw" href="#flake" transform="translate(880 150) scale(.9)" opacity=".45"/>
        <use class="tw" href="#flake" transform="translate(800 200) scale(.7)" opacity=".35"/>
        <use class="tw" href="#flake" transform="translate(940 60) scale(.6)" opacity=".35"/>
        <circle class="tw" cx="760" cy="30" r="3.5" fill="var(--gold)"/><circle class="tw" cx="850" cy="110" r="3" fill="var(--ribbon)"/><circle class="tw" cx="920" cy="210" r="3.5" fill="var(--gold)"/>
      </g>
      <g class="deco-anniv">
        <path d="M620 26c22 12 40-10 62 0s34 14 56 2" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" opacity=".4"/>
        <rect class="tw" x="780" y="30" width="14" height="6" rx="2" fill="var(--ribbon)" transform="rotate(30 787 33)"/>
        <rect class="tw" x="860" y="120" width="14" height="6" rx="2" fill="var(--accent)" transform="rotate(-20 867 123)"/>
        <rect class="tw" x="900" y="40" width="16" height="6" rx="2" fill="var(--gold)" transform="rotate(60 908 43)"/>
        <rect class="tw" x="810" y="200" width="12" height="5" rx="2" fill="var(--gold)" transform="rotate(-45 816 202)"/>
        <circle class="tw" cx="840" cy="80" r="5" fill="var(--accent)"/><circle class="tw" cx="920" cy="180" r="4" fill="var(--ribbon)"/><circle class="tw" cx="700" cy="44" r="3.5" fill="var(--gold)"/>
      </g>
      <g class="deco-meres">
        <use class="tw" href="#flower" transform="translate(830 50) scale(1.3)" fill="var(--accent)" opacity=".55"/>
        <use class="tw" href="#flower" transform="translate(900 170) scale(.9)" fill="var(--accent)" opacity=".4"/>
        <use class="tw" href="#flower" transform="translate(690 36) scale(.7)" fill="var(--ribbon)" opacity=".45"/>
        <use class="tw" href="#heart" transform="translate(880 100) scale(.9)" fill="var(--accent)" opacity=".5"/>
        <use class="tw" href="#heart" transform="translate(800 200) scale(.7)" fill="var(--gold)" opacity=".5"/>
        <use class="tw" href="#heart" transform="translate(950 50) scale(.6)" fill="var(--ribbon)" opacity=".45"/>
        <circle class="tw" cx="770" cy="28" r="3.5" fill="var(--gold)"/>
      </g>
      <g class="deco-peres">
        <use class="tw" href="#star" transform="translate(830 50) scale(1.3)" fill="var(--ribbon)" opacity=".6"/>
        <use class="tw" href="#star" transform="translate(900 160) scale(.9)" fill="var(--accent)" opacity=".45"/>
        <use class="tw" href="#star" transform="translate(690 34) scale(.7)" fill="var(--gold)" opacity=".55"/>
        <use class="tw" href="#star" transform="translate(950 70) scale(.6)" fill="var(--accent)" opacity=".4"/>
        <use class="tw" href="#star" transform="translate(800 200) scale(.7)" fill="var(--ribbon)" opacity=".45"/>
        <circle class="tw" cx="870" cy="110" r="3.5" fill="var(--gold)"/><circle class="tw" cx="770" cy="30" r="3" fill="var(--accent)"/>
      </g>
    </svg>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title">Cadeaux de la <em>famille</em></h1>
    <p class="sub" id="sub"></p>
    <div class="chips" id="chips"></div>
    <svg class="bow" viewBox="0 0 120 80" aria-hidden="true">
      <g fill="currentColor">
        <path d="M60 40C40 8 6 12 13 34c4 14 30 13 47 6Z"/><path d="M60 40C80 8 114 12 107 34c-4 14-30 13-47 6Z"/>
        <path d="M55 43 38 80l11-5 7 6 6-36Z"/><path d="M65 43l17 37-11-5-7 6-6-36Z"/>
      </g>
      <path d="M60 40C46 20 24 18 22 30" fill="none" stroke="#000" stroke-opacity=".18" stroke-width="3" stroke-linecap="round"/>
      <path d="M60 40C74 20 96 18 98 30" fill="none" stroke="#000" stroke-opacity=".18" stroke-width="3" stroke-linecap="round"/>
      <rect x="50" y="30" width="20" height="20" rx="7" fill="currentColor"/><rect x="50" y="30" width="20" height="20" rx="7" fill="#000" fill-opacity=".14"/>
    </svg>
  </header>
  <div class="panel" id="panel" hidden></div>

  <main>
    <div id="status" class="banner" hidden></div>
    <section id="gate" class="gate"><div class="empty">Chargement de la liste…</div></section>
    <section id="app" hidden>
      <div class="gifts">
        <aside><div class="side-h">La famille</div><div class="people" id="people"></div></aside>
        <div id="gift-panel"></div>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
/* ---------- Commun : session, appels au serveur, connexion, gestion de la famille ---------- */
const $=id=>document.getElementById(id);
function fill(el,...k){el.replaceChildren(...k.flat().filter(x=>x!=null&&x!==false))}
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const k in attrs||{}){const v=attrs[k];if(v==null||v===false)continue;if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(k==="text")e.textContent=v;else e.setAttribute(k,v===true?"":v)}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e}
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)||""}catch(e){return ""}}
let tt;function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,4000)}
const FAMILLE=["Paul","Laurence","Vincent","Jade","Ethen","Zoé","Chiara"];
const S={tok:load("tok"),d:null,ui:{panel:"",pick:"",lastCode:null,confirm:null},sel:""};
const pname=id=>((S.d&&S.d.people.find(p=>p.id===id))||{}).name||"Quelqu'un";
const isMe=id=>!!(S.d&&S.d.me&&S.d.me.id===id);
function genCode(){const a=new Uint32Array(1);crypto.getRandomValues(a);return String(100000+a[0]%900000)}
function setTok(t){S.tok=t||"";store("tok",S.tok)}

/* ---------- Icônes, occasion (Noël / Anniversaires), dates ---------- */
const ICONS={
  gift:'<path d="M3 9h18v4H3zM5 13v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7M12 9v12M12 9S10.5 4 8 4.5 7.5 9 12 9zM12 9s1.5-5 4-4.5S16.5 9 12 9z"/>',
  tree:'<path d="M12 2.5 17 9h-3l4.5 5.5h-3L20 20H4l4.5-5.5h-3L10 9H7z"/><path d="M12 20v2"/>',
  cake:'<path d="M3.5 21h17M5 21v-6.5A2.5 2.5 0 0 1 7.5 12h9a2.5 2.5 0 0 1 2.5 2.5V21M5 16.5c1.4 1 2.9 1 4.3 0s2.9-1 4.3 0 2.9 1 4.3 0M12 12V8.5M12 6.2c.9-.8.9-1.8 0-2.7-.9.9-.9 1.9 0 2.7z"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  mask:'<path d="M3 8c3-1.5 15-1.5 18 0 0 6-3 9-5 9-1.5 0-2.5-2-4-2s-2.5 2-4 2c-2 0-5-3-5-9z"/><path d="M7.5 11.5h2M14.5 11.5h2"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  heart:'<path d="M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.3a4.2 4.2 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"/>',
  tie:'<path d="M9.5 3h5l-1.2 3.2L15.5 16 12 21l-3.5-5 2.2-9.8z"/><path d="M10.7 6.2h2.6"/>',
  star:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>'
};
function ico(n){const s=document.createElement("span");s.className="ico";s.setAttribute("aria-hidden","true");s.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+ICONS[n]+'</svg>';return s}
document.querySelectorAll(".ico[data-i]").forEach(e=>e.replaceWith(ico(e.dataset.i)));
const OCC={noel:{label:"Noël",icon:"tree"},anniv:{label:"Anniversaire",icon:"cake"},meres:{label:"Fête des mères",icon:"heart"},peres:{label:"Fête des pères",icon:"tie"}};
const parentsOf=k=>((S.d&&S.d.people)||[]).filter(p=>p.parent===k);
const concerne=(p,k)=>!(k==="meres"||k==="peres")||p.parent===k;
const POUR={noel:" pour Noël",anniv:" pour l'anniversaire",meres:" pour la fête des mères",peres:" pour la fête des pères"};
S.occ=document.documentElement.getAttribute("data-occasion")||"noel";
S.ui.filter=S.occ;
document.querySelectorAll(".occ button").forEach(b=>b.addEventListener("click",()=>{S.occ=b.dataset.occ;S.ui.filter=S.occ;{const ps=parentsOf(S.occ);if(ps.length&&!ps.some(x=>x.id===S.sel))S.sel=ps[0].id}store("occ",S.occ+"|"+Date.now());document.documentElement.setAttribute("data-occasion",S.occ);render()}));
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const frDM=b=>{const[m,d]=b.split("-").map(Number);return (d===1?"1er":d)+" "+MOIS[m-1]};
function daysUntil(mmdd){
  const now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const[m,d]=mmdd.split("-").map(Number);
  const at=y=>new Date(y,m-1,m===2&&d===29&&new Date(y,1,29).getMonth()!==1?28:d);
  let t=at(t0.getFullYear());if(t<t0)t=at(t0.getFullYear()+1);
  return Math.round((t-t0)/864e5);
}
const inDays=n=>n===0?"aujourd'hui":n===1?"demain":"dans "+n+" jours";
const PALETTE=["#B3263A","#1E5B43","#6337B0","#A9661C","#2F6E9E","#A23C7A","#4E6B1F","#8A4B2C"];
const avColor=id=>{let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))>>>0;return PALETTE[h%PALETTE.length]};
const av=p=>h("span",{class:"av",style:"--c:"+avColor(p.id),"aria-hidden":"true",text:(p.name||"?").trim().charAt(0).toUpperCase()});
function nextBirthdays(){
  const ps=((S.d&&S.d.people)||[]).filter(p=>p.birthday);
  if(!ps.length)return null;
  const best=Math.min(...ps.map(p=>daysUntil(p.birthday)));
  return {days:best,people:ps.filter(p=>daysUntil(p.birthday)===best)};
}
const names=ps=>ps.map(p=>p.name).join(" et ");

const FETES=window.FETES||{meres:()=>new Date(NaN),peres:()=>new Date(NaN)};
const daysTo=dt=>{const n=new Date();return Math.round((dt-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/864e5)};
const jourFr=dt=>"dimanche "+(dt.getDate()===1?"1er":dt.getDate())+" "+MOIS[dt.getMonth()];
const HERO={
  noel:{icon:"tree",title:["La hotte de la ","famille"],sub:"Chacun note ses envies, les autres choisissent en secret ce qu'ils déposent sous le sapin."},
  anniv:{icon:"cake",title:["Les cadeaux de la ","famille"],sub:"Les envies de chacun pour son anniversaire, et qui offre quoi, sans gâcher la surprise."},
  meres:{icon:"heart",title:["Bonne fête, ","maman"],sub:"Une attention pour les mamans : chacun propose des idées et choisit en secret ce qu'il offre."},
  peres:{icon:"tie",title:["Bonne fête, ","papa"],sub:"Une attention pour les papas : chacun propose des idées et choisit en secret ce qu'il offre."}
};
function renderHero(){
  document.querySelectorAll(".occ button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.occ===S.occ?"true":"false"));
  const o=S.occ,H=HERO[o]||HERO.noel,y=new Date().getFullYear()+(new Date().getMonth()===11&&new Date().getDate()>25?1:0);
  const fm=FETES.meres(),fp=FETES.peres();
  const eyebrow={noel:"Noël "+y+" · en famille",anniv:"Anniversaires · en famille",meres:"Fête des mères · "+jourFr(fm),peres:"Fête des pères · "+jourFr(fp)}[o];
  fill($("eyebrow"),ico(H.icon),eyebrow);
  fill($("title"),H.title[0],h("em",{text:H.title[1]}));
  $("sub").textContent=H.sub;
  const xmas=daysUntil("12-25"),me=S.d&&S.d.me,chips={};
  chips.noel=h("span",{class:"chip"+(xmas===0?" hot":"")},ico("tree"),xmas===0?"Joyeux Noël !":"Noël "+inDays(xmas));
  const fete=(k,dt,hot)=>{const n=daysTo(dt);if(!(o===k||n<=60))return null;
    const qui=names(parentsOf(k));
    return h("span",{class:"chip"+(n===0?" hot":"")},ico(OCC[k].icon),n===0?(qui?"Bonne fête, "+qui+" !":hot):OCC[k].label+(qui?" de "+qui:"")+" "+inDays(n)+" · "+(dt.getDate()===1?"1er":dt.getDate())+" "+MOIS[dt.getMonth()])};
  chips.meres=fete("meres",fm,"Bonne fête à toutes les mamans !");
  chips.peres=fete("peres",fp,"Bonne fête à tous les papas !");
  if(me){
    const nb=nextBirthdays();
    if(nb)chips.anniv=h("span",{class:"chip"+(nb.days===0?" hot":"")},ico("cake"),nb.days===0?"Joyeux anniversaire, "+names(nb.people)+" !":"Anniversaire de "+names(nb.people)+" "+inDays(nb.days)+" · "+frDM(nb.people[0].birthday));
    else chips.anniv=h("button",{type:"button",class:"chip",onclick:()=>{S.ui.panel="bday";render()}},ico("cake"),"Ajouter les dates d'anniversaire");
  }
  fill($("chips"),[o,...["noel","anniv","meres","peres"].filter(k=>k!==o)].map(k=>chips[k]));
}

async function api(route,body){
  let r;
  try{r=await fetch("/api/"+route,{method:body?"POST":"GET",headers:Object.assign({"content-type":"application/json"},S.tok?{authorization:"Bearer "+S.tok}:{}),body:body?JSON.stringify(body):undefined})}
  catch(e){throw new Error("Pas de connexion au site. Vérifiez votre réseau.")}
  let d={};try{d=await r.json()}catch(e){}
  if(r.status===401&&route==="action"){setTok("");refresh()}
  if(!r.ok)throw new Error(d.error||"Le serveur ne répond pas (erreur "+r.status+").");
  return d;
}
async function refresh(){
  try{const d=await api("state");if(S.tok&&!d.me)setTok("");S.d=d;$("status").hidden=true;render()}
  catch(e){$("status").hidden=false;fill($("status"),h("strong",{text:"Liste indisponible."})," "+e.message)}
}
async function act(body,msg){try{const r=await api("action",body);if(r.token)setTok(r.token);if(msg)toast(msg);await refresh();return r}catch(e){toast(e.message);return null}}
function askConfirm(key){if(S.ui.confirm===key){S.ui.confirm=null;return true}S.ui.confirm=key;render();setTimeout(()=>{if(S.ui.confirm===key){S.ui.confirm=null;render()}},4000);return false}
function needMe(){return !(S.d&&S.d.me)}

function renderGate(){
  const d=S.d,box=$("gate");
  if(d.needsSetup){
    if(!S.ui.setup)S.ui.setup=FAMILLE.map(name=>({name,code:genCode()}));
    const rows=S.ui.setup;
    const field=(i,k,attrs)=>h("input",Object.assign({id:"su-"+k+i,value:rows[i][k],maxlength:k==="name"?"40":"12",oninput:e=>{rows[i][k]=e.target.value}},attrs));
    fill(box,h("div",{class:"gate-card wide"},
      h("h2",{text:"Première configuration"}),
      h("p",{class:"meta",text:"La famille est déjà inscrite. Un code est proposé pour chacun : gardez-le ou tapez le vôtre. Un code laissé vide pourra être donné plus tard."}),
      h("form",{class:"gate-form",onsubmit:async e=>{e.preventDefault();try{const r=await api("setup",{people:rows.map(x=>({name:x.name.trim(),code:x.code.trim()}))});setTok(r.token);S.ui.setup=null;S.ui.panel="fam";await refresh();toast("Accès créés. Transmettez à chacun son code.")}catch(err){toast(err.message)}}},
        h("div",{class:"su-head","aria-hidden":"true"},h("span",{text:"Prénom"}),h("span",{text:"Code"}),h("span")),
        ...rows.map((r,i)=>h("div",{class:"su-row"},
          field(i,"name",{"aria-label":"Prénom, ligne "+(i+1),required:true}),
          field(i,"code",{"aria-label":"Code de "+(r.name||"cette personne"),inputmode:"numeric",pattern:"[0-9]*",autocomplete:"off",placeholder:i===0?"Obligatoire":"Plus tard"}),
          i===0?h("span",{class:"su-tag",text:"Organisateur"}):h("button",{type:"button",class:"ghost danger","aria-label":"Retirer "+(r.name||"cette ligne"),onclick:()=>{rows.splice(i,1);render()}},"×"))),
        h("button",{type:"button",class:"ghost",onclick:()=>{rows.push({name:"",code:genCode()});render();$("su-name"+(rows.length-1)).focus()}},"+ Ajouter une personne"),
        h("p",{class:"meta",text:"La première ligne est l'organisateur : il pourra ensuite ajouter, retirer et redonner des codes."}),
        h("button",{class:"primary",type:"submit"},"Créer les accès"))));
    return;
  }
  const admin=d.people.find(p=>p.isAdmin);
  const pick=d.people.find(p=>p.id===S.ui.pick);
  fill(box,h("div",{class:"gate-card"},
